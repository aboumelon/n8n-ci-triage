name: Triage demo
on:
  workflow_dispatch:
    inputs:
      scenario:
        description: A deliberate failure, or a successful recovery
        type: choice
        default: dependency
        options:
          - dependency
          - test
          - lint
          - success
permissions:
  contents: read
jobs:
  controlled-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: 0.12.23
          python-version: '3.12'
      - run: uv sync --locked
      - name: Run the selected scenario
        env:
          DEMO_SCENARIO: ${{ inputs.scenario }}
        run: uv run python scripts/demo_ci.py "$DEMO_SCENARIO"
