name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: triage
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: triage_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U triage -d triage_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://triage:ci-only-password@localhost:5432/triage_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: 0.12.23
          python-version: '3.12'
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
      - run: python3 scripts/configure.py
      - run: docker compose config --quiet
      - run: docker compose build triage
