[project]
name = "n8n-ci-triage"
version = "0.1.0"
description = "Evidence-first GitHub Actions triage orchestrated by n8n"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.143.1,<0.144",
  "httpx[socks]>=0.28.1,<0.29",
  "pydantic-settings>=2.16,<3",
  "psycopg[binary]>=3.3.6,<4",
  "sqlalchemy>=2.0.44,<3",
  "uvicorn>=0.54,<0.55",
]

[dependency-groups]
dev = ["pytest>=9.1,<10", "ruff>=0.17,<0.18", "pyyaml>=6,<7"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ci_triage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
